<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday !!</title>

<style>
:root {
  --ink: #493d50;
  --cream: #fff8e9;
  --pink: #f3a8b8;
  --mint: #b9e1d5;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 20px 12px 30px;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: #f8e7c8;
  color: var(--ink);
  font-family: "Trebuchet MS", system-ui, sans-serif;
}

header {
  text-align: center;
  margin-bottom: 16px;
}

h1 {
  margin: 0;
  font-size: clamp(1.5rem, 5vw, 2.5rem);
}

header p { margin: 8px 0; }

.game {
  width: min(100%, 900px);
  padding: 9px;
  border: 4px solid white;
  border-radius: 18px;
  background: var(--cream);
  box-shadow: 0 8px 0 #d9bc9c;
}

canvas {
  width: 100%;
  height: auto;
  display: block;
  image-rendering: pixelated;
  border-radius: 8px;
  touch-action: none;
}

.hud {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  padding-top: 12px;
}

.hud span {
  background: white;
  border: 2px solid #ead9c1;
  border-radius: 20px;
  padding: 7px 11px;
  font-size: .9rem;
}

.controls {
  width: min(100%, 900px);
  margin-top: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

button {
  padding: 12px 15px;
  border: 0;
  border-radius: 12px;
  background: white;
  color: var(--ink);
  box-shadow: 0 4px 0 #d5bda4;
  font: inherit;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}

button:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #d5bda4;
}

button:focus-visible {
  outline: 3px solid #8b6fc0;
}

.pink { background: var(--pink); }
.mint { background: var(--mint); }

.dpad {
  display: grid;
  grid-template-columns: repeat(3, 44px);
  grid-template-rows: repeat(2, 42px);
  gap: 5px;
}

.dpad button { padding: 0; font-size: 18px; }
.up { grid-column: 2; grid-row: 1; }
.left { grid-column: 1; grid-row: 2; }
.down { grid-column: 2; grid-row: 2; }
.right { grid-column: 3; grid-row: 2; }

.action-buttons {
  display: flex;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 9px;
}

.help {
  text-align: center;
  font-size: .9rem;
  line-height: 1.8;
  margin-top: 15px;
}

.overlay {
  position: fixed;
  inset: 0;
  background: #30253a99;
  display: none;
  place-items: center;
  padding: 18px;
  z-index: 10;
}

.overlay.show { display: grid; }

.dialog {
  width: min(100%, 440px);
  padding: 24px;
  text-align: center;
  border: 4px solid white;
  border-radius: 20px;
  background: var(--cream);
  box-shadow: 0 8px 0 #d9bc9c;
}

.dialog h2 { margin-top: 0; }

.dialog p {
  line-height: 1.7;
  white-space: pre-line;
}

.dialog-buttons {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 15px;
}

.meter {
  height: 12px;
  background: #ead9c1;
  border-radius: 10px;
  overflow: hidden;
  margin: 12px 0;
}

.meter div {
  width: 0;
  height: 100%;
  background: #83c8ad;
}

@media (max-width: 560px) {
  .controls { flex-direction: column; }

  .dpad {
    grid-template-columns: repeat(3, 54px);
    grid-template-rows: repeat(2, 48px);
  }

  .action-buttons { justify-content: center; }
  .hud span { font-size: .78rem; }
}
</style>
</head>

<body>

<header>
  <h1>HAPPY BIRTHDAY !! 🎂🎂 </h1>
  <p>explore the room for surprises (ouu shi)</p>
</header>

<main class="game">
  <canvas id="world" width="640" height="400"
    aria-label="Cozy pastel pixel-art birthday room"></canvas>

  <div class="hud">
    <span>📍 <b id="location">Birthday room</b></span>
    <span>💫 Found: <b id="found">0 / 4</b></span>
    <span>🎂 Candles: <b id="candles">3 lit</b></span>
  </div>
</main>

<div class="controls">
  <div class="dpad">
    <button class="up" data-key="ArrowUp">▲</button>
    <button class="left" data-key="ArrowLeft">◀</button>
    <button class="down" data-key="ArrowDown">▼</button>
    <button class="right" data-key="ArrowRight">▶</button>
  </div>

  <div class="action-buttons">
    <button class="pink" id="interact">Interact → E</button>
    <button class="mint" id="blow">🕯️ Blow out candles</button>
  </div>
</div>

<p class="help">
  Move: WASD / arrow keys<br>
  Interact: E / Space<br>
  Mobile: use the arrow buttons
</p>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="dialog">
    <h2 id="dialogTitle">Welcome!</h2>
    <p id="dialogText"></p>
    <div id="dialogExtra"></div>
    <div class="dialog-buttons">
      <button class="pink" id="close">kewl 😳😳</button>
    </div>
  </div>
</div>

<script>
(() => {

  const player = { x: 320, y: 345, speed: 2.5 };

  let dialogOpen = false;
  let micStream = null;
  let audioContext = null;
  let analyser = null;
  let micFrame = 0;
  let micActive = false;
  let particles = [];
  let tick = 0;

  const objects = [
    {
      id: "plant",
      name: "Little plant",
      x: 151, y: 165, radius: 36,

      message: "even the plant is celebrating w u!!\n\n keep growing and keep being you :)"
    },
    {

      name: "Present",
      x: 460, y: 334, radius: 38,
      title: "brr brr patapresent",
      message: "surprise!! this gift contains one imaginary golden trophy for surviving another year !1\n\nits verrryy shiny trust."
    },
    {
      id: "radio",
      name: "Birthday radio",
      x: 160, y: 235, radius: 36,

    },
    {
      id: "note",

      x: 535, y: 235, radius: 36,
      title: "NOOOTEE",
      message: "YOYO!! Happy birthday!!\n\nik we haven't known each other for that long, but im supperr duuuper glad we got to meet. i hope your day is full of good food (🤤🤤), warm laughs, and LOTS of little things that make you happy.\n\have the best birthday broski!!"
    },
    {
      id: "cake",
      name: "Birthday cake",
      x: 322, y: 119, radius: 43,
      title: "BIRTHDAY CAKE !! 🎂🎂",
      message: "three candles!! make a wish and blow them out using the microphone button!\n\n i wouldnt recommend using the microphone though.. maybe just do it manually BUTT if you want to try, make sure to allow microphone access and blow into your mic like a real birthday wish!! or you can just start yelling"
    }
  ];

  function rect(x, y, w, h, color) {
    ctx.fillStyle = color;
    ctx.fillRect(Math.round(x), Math.round(y), w, h);
  }

  function label(str, x, y, color = "#493d50", size = 10) {
    ctx.fillStyle = color;
    ctx.font = `bold ${size}px monospace`;
    ctx.textAlign = "center";
    ctx.fillText(str, x, y);
  }

  function outline(x, y, w, h, color) {
    rect(x, y, w, 2, color);
    rect(x, y + h - 2, w, 2, color);
    rect(x, y, 2, h, color);
    rect(x + w - 2, y, 2, h, color);

  function drawRoom() {
    // Floor
    rect(0, 0, 640, 400, "#d8edda");

    for (let y = 0; y < 400; y += 32) {
      for (let x = 0; x < 640; x += 32) {
        if (((x / 32) + (y / 32)) % 2 === 0) {
          rect(x, y, 32, 32, "#d1e8d4");
        }

        rect(x, y, 32, 1, "#c4dfc9");
        rect(x, y, 1, 32, "#c4dfc9");

    }

    // Peach walls and wooden skirting
    rect(0, 0, 640, 112, "#f1d0b7");
    rect(0, 0, 640, 7, "#f8e0c9");
    rect(0, 104, 640, 9, "#d7a486");
    rect(0, 112, 640, 5, "#c28c70");

    // Wallpaper details
    for (let x = 18; x < 640; x += 35) {
      for (let y = 18; y < 95; y += 27) {
        rect(x, y, 2, 2, "#e6b7a4");
      }
    }

    // Window
    rect(244, 17, 151, 76, "#b88972");
    rect(250, 22, 139, 65, "#91cbd9");
    rect(257, 28, 125, 53, "#bce7e7");
    rect(318, 28, 4, 53, "#fff0d0");
    rect(257, 53, 125, 4, "#fff0d0");

    // Stars outside the window
    for (const [x, y] of [
      [270,39], [291,67], [344,39], [366,62], [352,74]
    ]) {
      rect(x, y, 3, 3, "#fff8cf");
      rect(x + 1, y - 2, 1, 7, "#fff8cf");
    }

    // Curtains and windowsill
    rect(235, 14, 16, 84, "#e8a2b0");
    rect(389, 14, 16, 84, "#e8a2b0");
    rect(235, 14, 7, 84, "#d98e9f");
    rect(398, 14, 7, 84, "#d98e9f");
    rect(239, 88, 163, 7, "#b88972");

    // Birthday bunting: colorful hanging triangular flags
    rect(87, 25, 466, 2, "#b88972");

    const buntingColors = [
      "#f3a8b8", "#f6d77d", "#9dcfc6", "#b5a5d8"
    ];

    for (let i = 0; i < 12; i++) {
      const x = 94 + i * 39;
      const y = 27 + Math.round(Math.sin(i / 11 * Math.PI) * 11);
      const color = buntingColors[i % buntingColors.length];

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + 14, y);
      ctx.lineTo(x + 7, y + 19);
      ctx.closePath();
      ctx.fill();

      // Little highlight on each flag
      rect(x + 4, y + 3, 3, 5, "#fff8e9");
    }

    label("HAPPY BDAY!", 320, 101, "#a56f78", 11);

    // Wall art: framed plant picture
    rect(38, 34, 54, 48, "#b88972");
    rect(42, 38, 46, 40, "#fff4dc");
    rect(49, 46, 32, 24, "#bde1d3");
    rect(54, 51, 22, 14, "#80b99d");
    rect(58, 47, 4, 4, "#f6d77d");
    rect(69, 57, 5, 5, "#f3a8b8");

    // Wall art: framed heart
    rect(532, 37, 55, 45, "#b88972");
    rect(536, 41, 47, 37, "#fff4dc");
    rect(542, 47, 35, 25, "#f6d7df");
    rect(547, 54, 25, 12, "#f3a8b8");
    label("♡", 559, 64, "#fff8e9", 15);

    // Cozy central rug
    rect(192, 219, 260, 139, "#d69ba8");
    rect(200, 227, 244, 123, "#f4cfc9");
    rect(211, 238, 222, 101, "#e9b0bc");
    rect(220, 247, 204, 83, "#f8dfd4");

    for (let x = 205; x < 440; x += 12) {
      rect(x, 219, 5, 3, "#f7d9d5");
      rect(x, 355, 5, 3, "#f7d9d5");
    }

    // Bookshelf against left wall
    rect(22, 122, 106, 76, "#b88972");
    rect(27, 127, 96, 66, "#d9ad87");
    rect(25, 158, 100, 6, "#9f745d");
    rect(25, 188, 100, 6, "#9f745d");

    // Books on upper shelf
    rect(34, 132, 11, 23, "#8d9fc4");
    rect(47, 129, 12, 26, "#e9a0b4");
    rect(61, 135, 10, 20, "#f6d77d");
    rect(74, 131, 13, 24, "#9dcfc6");
    rect(91, 134, 19, 21, "#b5a5d8");

    // Books on lower shelf
    rect(33, 166, 15, 19, "#e9a0b4");
    rect(50, 169, 11, 16, "#f6d77d");
    rect(64, 165, 13, 20, "#8d9fc4");
    rect(80, 168, 12, 17, "#9dcfc6");
    rect(95, 164, 15, 21, "#b5a5d8");

    // Desk: legs, front, top
    rect(91, 207, 105, 62, "#9f745d");
    rect(85, 202, 117, 13, "#b88972");
    rect(92, 211, 103, 49, "#d9ad87");
    rect(96, 262, 8, 28, "#9f745d");
    rect(183, 262, 8, 28, "#9f745d");

    // Paper and pencil on the desk
    rect(105, 217, 30, 20, "#fff4dc");
    rect(109, 222, 21, 2, "#d7c2a5");
    rect(109, 228, 17, 2, "#d7c2a5");
    rect(109, 234, 19, 2, "#d7c2a5");
    rect(133, 217, 3, 19, "#e58d85");

    // Radio on the desk
    rect(139, 220, 43, 30, "#8f91b8");
    rect(143, 224, 35, 22, "#b9b9d7");
    rect(146, 227, 17, 13, "#6d789d");
    rect(149, 230, 3, 3, "#9dcfc6");
    rect(167, 227, 7, 7, "#f4d77b");
    rect(167, 237, 7, 3, "#6d789d");
    rect(144, 247, 33, 2, "#77789d");
    label("♪", 182, 219, "#8f91b8", 12);

    // Lamp on desk
    rect(170, 229, 15, 3, "#9f745d");
    rect(176, 216, 4, 14, "#6d789d");
    rect(168, 210, 20, 8, "#f6d77d");
    rect(171, 212, 14, 4, "#ffe9a3");

    // Cake table
    rect(278, 144, 89, 58, "#9f745d");
    rect(270, 138, 105, 12, "#b88972");
    rect(278, 149, 89, 44, "#d9ad87");
    rect(283, 193, 8, 23, "#9f745d");
    rect(354, 193, 8, 23, "#9f745d");

    // Small decorative flowers on the cabinet
    rect(506, 220, 18, 21, "#9dcfc6");
    rect(504, 218, 22, 4, "#78b5a8");
    rect(514, 204, 3, 17, "#529b70");
    rect(505, 207, 12, 9, "#f3a8b8");
    rect(515, 201, 12, 9, "#f6d77d");
    rect(519, 211, 10, 8, "#b5a5d8");

    // Right-side cabinet
    rect(492, 245, 103, 39, "#b88972");
    rect(498, 250, 91, 29, "#d9ad87");
    rect(502, 258, 37, 2, "#9f745d");
    rect(502, 269, 37, 2, "#9f745d");
    rect(549, 253, 34, 22, "#f1d8bd");
    outline(549, 253, 34, 22, "#9f745d");

    // Neat books stacked on the cabinet
    rect(538, 234, 42, 5, "#8d9fc4");
    rect(542, 229, 38, 5, "#e9a0b4");
    rect(546, 224, 34, 5, "#f6d77d");

    // Floor plant moved to the right of the bookshelf
    // Its pot sits on the floor, clear of the bookshelf.
    drawPlant({ x: 151, y: 165 });

    // Balloons with separate strings tied to nearby furniture
    drawBalloon(218, 174, "#f3a8b8", 0, 195, 207);
    drawBalloon(238, 169, "#f6d77d", 1, 198, 207);
    drawBalloon(420, 174, "#9dcfc6", 2, 395, 207);

    // Chair beside the desk

    // Welcome mat
    rect(270, 374, 100, 15, "#d69ba8");
    rect(276, 378, 88, 7, "#f8dfd4");
    label("WELCOME ♡", 320, 385, "#a56f78", 7);
  }

  function drawBalloon(x, y, color, phase, tieX, tieY) {
    const bob = Math.sin(tick / 250 + phase) * 2;
    const by = y + bob;

    // Balloon body
    rect(x - 8, by - 12, 16, 18, color);
    rect(x - 5, by - 16, 10, 5, color);
    rect(x - 2, by + 6, 4, 4, color);

    // Highlight
    rect(x - 5, by - 8, 3, 5, "#fff8e9");
    rect(x - 4, by - 11, 2, 2, "#fff8e9");

    // Balloon string: small connected pixel segments
    const startX = x;
    const startY = by + 10;
    const endX = tieX;
    const endY = tieY;

    const steps = 12;

    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const sx = startX + (endX - startX) * t;
      const sy = startY + (endY - startY) * t;

      // Gentle curve so the strings don't look like straight wires
      const curve = Math.sin(t * Math.PI) * (endX - startX) * 0.08;

      rect(sx + curve, sy, 2, 2, "#a58c84");
    }

    // Tiny knot at the tie point
    rect(tieX - 2, tieY, 4, 3, "#a58c84");
  }

  function drawPlant(o) {
    // Shadow
    rect(o.x - 20, o.y + 14, 40, 5, "#b7d0b6");

    // Pot
    rect(o.x - 17, o.y + 2, 34, 23, "#b98c6b");
    rect(o.x - 14, o.y + 5, 28, 15, "#d69e83");
    rect(o.x - 17, o.y + 2, 34, 4, "#8b654f");

    // Stems
    rect(o.x - 4, o.y - 18, 8, 22, "#529b70");

    // Leaves
    rect(o.x - 16, o.y - 17, 15, 10, "#69b781");
    rect(o.x - 24, o.y - 22, 13, 10, "#80c68d");
    rect(o.x + 3, o.y - 25, 16, 12, "#5ca978");
    rect(o.x + 12, o.y - 13, 13, 9, "#82cc92");
    rect(o.x - 8, o.y - 31, 13, 11, "#91d59b");
    rect(o.x - 3, o.y - 26, 3, 3, "#c9e9b7");
  }

  function drawGift(o) {
    // Shadow makes the present visibly rest on the floor
    rect(o.x - 25, o.y + 17, 50, 5, "#b7d0b6");

    // Box
    rect(o.x - 23, o.y - 12, 46, 31, "#e68c9f");
    rect(o.x - 23, o.y - 12, 46, 6, "#d96e89");

    // Ribbon
    rect(o.x - 5, o.y - 12, 10, 31, "#f6d77d");
    rect(o.x - 23, o.y + 1, 46, 7, "#f6d77d");

    // Bow
    rect(o.x - 17, o.y - 23, 14, 11, "#f6d77d");
    rect(o.x + 3, o.y - 23, 14, 11, "#f6d77d");
    rect(o.x - 4, o.y - 22, 8, 8, "#fff0ae");
  }

  function drawRadio() {
    // Radio is drawn on the desk in drawRoom().
  }

  function drawNote(o) {
    rect(o.x - 21, o.y - 13, 42, 29, "#fff7d8");
    outline(o.x - 21, o.y - 13, 42, 29, "#e5cda5");
    rect(o.x - 15, o.y - 7, 29, 2, "#e5cda5");
    rect(o.x - 15, o.y - 1, 24, 2, "#e5cda5");
    rect(o.x - 15, o.y + 5, 27, 2, "#e5cda5");
    rect(o.x + 9, o.y + 7, 9, 9, "#f3a8b8");
  }

  function drawCake(o) {
    // Serving plate
    rect(o.x - 37, o.y + 23, 74, 5, "#b7d0b6");
    rect(o.x - 34, o.y + 13, 68, 10, "#b9dedd");
    rect(o.x - 30, o.y + 9, 60, 5, "#fff5e0");

    // Cake layers
    rect(o.x - 31, o.y - 5, 62, 25, "#e9a0b4");
    rect(o.x - 31, o.y + 7, 62, 5, "#d87f9b");

    // Frosting
    rect(o.x - 34, o.y - 9, 68, 10, "#fff1dc");
    rect(o.x - 29, o.y - 14, 8, 9, "#fff1dc");
    rect(o.x - 10, o.y - 14, 8, 9, "#fff1dc");
    rect(o.x + 11, o.y - 14, 8, 9, "#fff1dc");
    rect(o.x + 26, o.y - 14, 7, 9, "#fff1dc");

    // Sprinkles
    rect(o.x - 22, o.y + 1, 4, 3, "#8fcac4");
    rect(o.x - 7, o.y + 2, 4, 3, "#f6d77d");
    rect(o.x + 8, o.y + 1, 4, 3, "#8fcac4");
    rect(o.x + 21, o.y + 2, 4, 3, "#f6d77d");

    // Candles and animated flames
    for (let i = 0; i < 3; i++) {
      const cx = o.x - 17 + i * 17;
      rect(cx - 2, o.y - 27, 4, 14, "#f6d77d");

      if (i >= candlesOut) {
        const flicker = Math.sin(tick / 100 + i * 2) * 2;

        rect(cx - 3, o.y - 35 + flicker, 6, 7, "#f3a54b");
        rect(cx - 1, o.y - 33 + flicker, 2, 4, "#fff2a3");
      } else {
        rect(cx - 2, o.y - 15, 4, 3, "#c9a8a8");
      }
    }

    if (candlesOut === 3) {
      label("YAY!", o.x, o.y - 46, "#d76e8c", 12);
    }
  }

  function drawObjects() {
    const ordered = [...objects].sort((a, b) => a.y - b.y);

    for (const o of ordered) {
      if (o.y < player.y) drawObject(o);
    }

    drawPlayer();

    for (const o of ordered) {
      if (o.y >= player.y) drawObject(o);
    }
  }

  function drawObject(o) {
    if (o.id === "plant") drawPlant(o);
    if (o.id === "gift") drawGift(o);
    if (o.id === "radio") drawRadio();
    if (o.id === "note") drawNote(o);
    if (o.id === "cake") drawCake(o);

    if (discovered.has(o.id) && o.id !== "cake") {
      rect(o.x - 2, o.y - 42, 5, 5, "#f6d77d");
    }
  }

  function drawPlayer() {
    const x = Math.round(player.x);
    const y = Math.round(player.y);

    const moving = [...keys].some(k =>
      ["arrowleft", "arrowright", "arrowup", "arrowdown",
       "a", "d", "w", "s"].includes(k)
    );

    const bob = moving && tick % 220 < 110 ? 1 : 0;

    rect(x - 10, y + 9, 20, 5, "#b7d0b6");

    // Hair
    rect(x - 8, y - 13 + bob, 16, 8, "#594452");
    rect(x - 10, y - 9 + bob, 4, 9, "#594452");
    rect(x + 6, y - 9 + bob, 4, 9, "#594452");

    // Face
    rect(x - 7, y - 8 + bob, 14, 10, "#f3c7a3");
    rect(x - 5, y - 4 + bob, 2, 2, "#493d50");
    rect(x + 3, y - 4 + bob, 2, 2, "#493d50");
    rect(x - 2, y + bob, 4, 1, "#c77b78");

    // Shirt and arms
    rect(x - 9, y + 2 + bob, 18, 10, "#8e9bc9");
    rect(x - 11, y + 4 + bob, 3, 8, "#8e9bc9");
    rect(x + 8, y + 4 + bob, 3, 8, "#8e9bc9");

    // Legs and shoes
    rect(x - 7, y + 12 + bob, 6, 7, "#6d729b");
    rect(x + 1, y + 12 + bob, 6, 7, "#6d729b");
    rect(x - 8, y + 18 + bob, 7, 3, "#6a5968");
    rect(x + 1, y + 18 + bob, 7, 3, "#6a5968");
  }

  function updateNearby() {
    nearby = null;
    let shortest = Infinity;

    for (const o of objects) {
      const d = Math.hypot(player.x - o.x, player.y - o.y);

      if (d < o.radius && d < shortest) {
        nearby = o;
        shortest = d;
      }
    }

    $("location").textContent = nearby ? nearby.name : "Birthday room";
    $("found").textContent = `${discovered.size} / 4`;
    $("candles").textContent =
      candlesOut === 3 ? "all out" : `${3 - candlesOut} lit`;
  }

  function drawPrompt() {
    if (!nearby || dialogOpen) return;

    const y = nearby.y - 55;
    rect(nearby.x - 37, y, 74, 15, "#fff8e9");
    label("PRESS E", nearby.x, y + 11, "#493d50", 9);
  }

  function showDialog(title, message, extra = null) {
    dialogOpen = true;
    $("dialogTitle").textContent = title;
    $("dialogText").textContent = message;

    const extraBox = $("dialogExtra");
    extraBox.replaceChildren();

    if (extra) extraBox.appendChild(extra);

    $("overlay").classList.add("show");
    $("close").focus();
  }

  function closeDialog() {
    $("overlay").classList.remove("show");
    $("dialogExtra").replaceChildren();
    dialogOpen = false;
  }

  $("close").addEventListener("click", closeDialog);

  $("overlay").addEventListener("click", e => {
    if (e.target === $("overlay")) closeDialog();
  });

  function interact() {
    if (dialogOpen) return;

    if (!nearby) {
      showDialog(
        "EXPLORE A LITTLE!!",
        "Walk close to an object and press E or tap Interact to discover it."
      );
      return;
    }

    if (nearby.id === "cake") {
      if (candlesOut === 3) {
        showDialog(
          "WOOOHOOHOO! 🎉",
          "all the candles are out!\n\nagain, i hope your birthday is full of good food, warm laughs, and lots of happy little moments. im supre duper glad we got to meet. have the best day!!"
        );
      } else {
        showDialog("Make a (verityual) wish!!", nearby.message, cakeButtons());
      }

      return;
    }

    discovered.add(nearby.id);
    updateNearby();
    showDialog(nearby.title, nearby.message);
  }

  function cakeButtons() {
    const wrap = document.createElement("div");
    wrap.className = "dialog-buttons";

    const mic = document.createElement("button");
    mic.className = "mint";
    mic.textContent = "🎤 Use microphone";

    mic.onclick = () => {
      closeDialog();
      startMic();
    };

    const manual = document.createElement("button");
    manual.textContent = "Blow one out";

    manual.onclick = () => {
      closeDialog();
      blowOne();
    };

    wrap.append(mic, manual);
    return wrap;
  }

  function makeParticle(x, y) {
    const colors = [
      "#f3a8b8", "#f6d77d", "#8fcac4",
      "#b5a5d8", "#fff8e9"
    ];

    return {
      x, y,
      vx: (Math.random() - .5) * 4,
      vy: -Math.random() * 4 - 1,
      life: 60 + Math.random() * 40,
      size: 2 + Math.random() * 3,
      color: colors[Math.floor(Math.random() * colors.length)]
    };
  }

  function blowOne() {
    if (candlesOut >= 3) return;

    candlesOut++;

    for (let i = 0; i < 45; i++) {
      particles.push(makeParticle(322, 119));
    }

    updateNearby();

    if (candlesOut === 3) {
      stopMic();

      setTimeout(() => {
        showDialog(
          "HAPPY BIRTHDAY!! 🎉",
          "YOU DID IT!! All three candles are out!\n\nI hope your birthday is full of good food, good laughs, and lots of happy little moments. I'm glad we got to meet, and I hope this next year brings you lots of things to smile about.\n\nHave the best day!! :D"
        );
      }, 300);
    }
  }

  function particleFrame() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];

      p.x += p.vx;
      p.y += p.vy;
      p.vy += .07;
      p.life--;

      rect(p.x, p.y, p.size, p.size, p.color);

      if (p.life <= 0 || p.y > 400) {
        particles.splice(i, 1);
      }
    }
  }

  async function startMic() {
    if (candlesOut >= 3) {
      showDialog(
        "All done! 🎉",
        "All three candles are already out. Make a wish!"
      );
      return;
    }

    if (!navigator.mediaDevices?.getUserMedia) {
      showDialog(
        "Microphone unavailable 🎤",
        "Open this site on localhost or HTTPS and allow microphone access. You can use the manual candle button for now.",
        backupButton()
      );
      return;
    }

    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: false
        }
      });

      const Audio = window.AudioContext || window.webkitAudioContext;
      audioContext = new Audio();
      const source = audioContext.createMediaStreamSource(micStream);

      analyser = audioContext.createAnalyser();
      analyser.fftSize = 512;

      source.connect(analyser);
      micActive = true;

      const content = document.createElement("div");

      content.innerHTML = `
        <p>Blow toward your microphone!</p>
        <div class="meter"><div id="micLevel"></div></div>
        <p id="micStatus">Listening for a puff of air…</p>
      `;

      const manual = document.createElement("button");
      manual.className = "pink";
      manual.textContent = "Blow a candle manually";
      manual.onclick = blowOne;

      content.appendChild(manual);

      showDialog(
        "Ready, set, blow! 🎤",
        "Try blowing toward your microphone. If it doesn't detect the air, use the manual button.",
        content
      );

      const data = new Uint8Array(analyser.fftSize);
      let loudFrames = 0;
      let cooldown = 0;

      function listen() {
        if (!micActive || !analyser) return;

        analyser.getByteTimeDomainData(data);

        let sum = 0;

        for (const sample of data) {
          const v = (sample - 128) / 128;
          sum += v * v;
        }

        const rms = Math.sqrt(sum / data.length);
        const level = Math.min(100, rms * 400);
        const meter = $("micLevel");

        if (meter) meter.style.width = level + "%";

        if (rms > .12) loudFrames++;
        else loudFrames = Math.max(0, loudFrames - 2);

        if (cooldown > 0) cooldown--;

        if (loudFrames >= 8 && cooldown === 0) {
          loudFrames = 0;
          cooldown = 45;

          blowOne();

          const status = $("micStatus");

          if (status) {
            status.textContent =
              candlesOut < 3
                ? "Nice! One candle down. Blow again!"
                : "All candles out!";
          }
        }

        micFrame = requestAnimationFrame(listen);
      }

      listen();

    } catch (error) {
      stopMic();

      showDialog(
        "Couldn't access the mic 🎤",
        "Check your browser's microphone permission, or use the backup button instead. HEY ITS ME ITS VERITY",
        backupButton()
      );
    }
  }

  function backupButton() {
    const button = document.createElement("button");
    button.className = "pink";
    button.textContent = "Blow a candle";

    button.onclick = () => {
      closeDialog();
      blowOne();
    };

    return button;
  }

  function stopMic() {
    micActive = false;
    cancelAnimationFrame(micFrame);

    if (micStream) {
      micStream.getTracks().forEach(track => track.stop());
      micStream = null;
    }

    if (audioContext) {
      audioContext.close().catch(() => {});
      audioContext = null;
    }

    analyser = null;
  }

  $("blow").addEventListener("click", startMic);
  $("interact").addEventListener("click", interact);

  function move(dx, dy) {
    if (dialogOpen) return;

    if (dx && dy) {
      dx *= .707;
      dy *= .707;
    }

    player.x = Math.max(
      24,
      Math.min(616, player.x + dx * player.speed)
    );

    player.y = Math.max(
      130,
      Math.min(365, player.y + dy * player.speed)
    );
  }

  function frame(time) {
    tick = time;

    let dx = 0;
    let dy = 0;

    if (!dialogOpen) {
      if (keys.has("arrowleft") || keys.has("a")) dx--;
      if (keys.has("arrowright") || keys.has("d")) dx++;
      if (keys.has("arrowup") || keys.has("w")) dy--;
      if (keys.has("arrowdown") || keys.has("s")) dy++;

      move(dx, dy);
    }

    drawRoom();
    updateNearby();
    drawObjects();
    drawPrompt();
    particleFrame();

    requestAnimationFrame(frame);
  }

  window.addEventListener("keydown", e => {
    const key = e.key.toLowerCase();

    if ([
      "arrowup", "arrowdown", "arrowleft", "arrowright", " "
    ].includes(key)) {
      e.preventDefault();
    }

    if (key === "e" || key === " ") {
      if (!e.repeat) interact();
      return;
    }

    if ([
      "arrowup", "arrowdown", "arrowleft", "arrowright",
      "w", "a", "s", "d"
    ].includes(key)) {
      if (!dialogOpen) keys.add(key);
    }
  });

  window.addEventListener("keyup", e => {
    keys.delete(e.key.toLowerCase());
  });

  window.addEventListener("blur", () => keys.clear());

  document.querySelectorAll("[data-key]").forEach(button => {
    const key = button.dataset.key;

    button.addEventListener("pointerdown", e => {
      e.preventDefault();
      if (!dialogOpen) keys.add(key);
    });

    for (const event of [
      "pointerup", "pointerleave", "pointercancel"
    ]) {
      button.addEventListener(event, () => keys.delete(key));
    }
  });

  showDialog(
    "WELCOME TO THE BIRTHDAY WEBSITE!!",
    "Take a little walk around! Get close to an object and press E or tap Interact. There are little things to discover, and a cake waiting for you!!"
  );

  requestAnimationFrame(frame);
})();
</script>
